<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Title</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
            width: 50%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .form-container {
            text-align: center;
            margin: 20px 0;
        }
        table input[type=submit] {
            background-color: #f2f2f2;
             border: 1px solid #ddd;
             cursor: pointer;
             font-size: 14px;
             color: #333;
        }

<!--        table .td-back{-->
<!--            background-color: #f5f5f5;-->
<!--        }-->
    </style>
</head>
<body>
<div align="center">
    <h1>멤버리스트 보기</h1>

    <table>
        <thead>
        <tr>
            <th>NO</th>
            <th>아이디</th>
            <th>비밀번호</th>
            <th>승인상태</th>
            <th>정답수</th>
            <th>오답수</th>
            <th>등록일</th>
            <th>승인</th>
            <th>상세보기</th>
            <th>수정</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${list == null or #lists.isEmpty(list)}">
            <td colspan="11">데이터가 없습니다.</td>
        </tr>
        <tr th:unless="${list == null or #lists.isEmpty(list)}"
            th:each="member : ${list}" th:object="${member}">
            <td th:text="*{no}">1</td>
            <td th:text="*{id}">root</td>
            <td th:text="*{password}">password</td>
            <td th:text="*{status} ? '승인' : '미승인'">미승인</td>
            <td th:text="*{answerTrue}">0</td>
            <td th:text="*{answerFalse}">0</td>
            <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
            <td class="td-back">
                <form th:action="@{/member/approve}" method="post"
                      th:if="*{status} == false">
                    <input type="hidden" name="updateId" th:value="*{no}">
                    <input type="submit" value="승인"
                           onclick="return confirm('승인하시겠습니까?')">
                </form>
                <span th:if="*{status} == true" style="color: green; font-size:14px;">승인완료</span>
            </td>
            <td class="td-back">
                <form th:action="@{/member/info}" method="get">
                    <input type="hidden" name="updateId" th:value="*{no}" />
                    <input type="submit" value="상세보기" />
                </form>
            </td>
            <td class="td-back">
                <form th:action="@{/member/updateView}" method="get">
                    <input type="hidden" name="updateId" th:value="*{id}">
                    <input type="submit" value="수정">
                </form>
            </td>
            <td class="td-back">
                <form th:action="@{/member/delete/{id}(id=*{no})}" method="post">
                    <input type="submit" value="삭제"
                           onclick="return confirm('정말 삭제하시겠습니까?')">
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <hr>

    <!-- 검색 폼 -->
    <div class="form-container">
        <form th:action="@{/member/search}" method="get">
            <select name="type">
<!--                <option value="">전체보기</option>-->
                <option value="id">아이디</option>
            </select>
            <input type="text" name="keyword" placeholder="검색어를 입력하세요">
            <input type="submit" value="검색">
        </form>
    </div>

    <hr>

    <!-- 신규 멤버 등록 버튼 -->
    <div class="form-container">
        <form th:action="@{/member/insertForm}" method="get">
            <input type="submit" value="신규멤버입력">
        </form>
        <br>
        <a th:href="@{/}">메인화면</a>
    </div>
</div>
</body>
</html>
