<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <style>
    body {
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-container {
        background: white;
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        max-width: 400px;
        width: 90%;
    }

    .logo {
        font-size: 3em;
        font-weight: bold;
        color: #111;
        margin-bottom: 10px;
    }

    .logo > span {
        font-size: 0.8em;
    }

    .subtitle {
        font-size: 1.2em;
        color: #666;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 10px;
        text-align: left;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: bold;
    }

    .form-group:last-of-type{
    margin-bottom: 36px;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s ease;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }

    .btn {
        width: 100%;
        display: inline-block;
        padding: 8px 15px;
        padding: 12px 25px;
        font-size: 0.9em;
        background-color: #111;
        border: 2px solid #111;
        color: #fff;
        border-radius: 8px;
        box-sizing : border-box;
        margin-top: 8px;
    }

    .btn:hover {
        background-color: #f9f9f9;
        color: #111;
    }

    .error-message {
        color: #dc3545;
        margin-bottom: 20px;
        padding: 10px;
        border: 1px solid #dc3545;
        border-radius: 5px;
        background-color: #f8d7da;
    }

    .demo-accounts {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        margin-top: 30px;
        text-align: left;
    }

    .demo-accounts h4 {
        margin: 0 0 15px 0;
        color: #333;
        text-align: center;
    }

    .demo-account {
        margin-bottom: 10px;
        padding: 8px;
        background: white;
        border-radius: 5px;
        font-size: 14px;
    }

    .demo-account strong {
        color: #667eea;
    }

    .footer {
        margin-top: 30px;
        color: #666;
        font-size: 0.9em;
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="logo"><span>🎯</span> 퀴즈</div>
  <div class="subtitle">로그인하여 퀴즈를 시작하세요!</div>

  <div class="error-message" th:if="${error}" th:text="${error}">
    아이디 또는 비밀번호가 올바르지 않습니다.
  </div>

  <form id="loginForm" th:action="@{/login}" method="post">
    <div class="form-group">
      <label for="id">아이디</label>
      <input type="text" id="id" name="id" required>
    </div>

    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" required>
    </div>

    <button type="submit" class="btn">로그인</button>
    <a href="/member/insertForm" class="btn btn-secondary"
       style="display: inline-block; text-decoration: none; text-align: center;">회원가입</a>
  </form>

  <div class="footer">
    <p>&copy; 2024 Quiz Application. 퀴즈로 더 스마트해지세요! 🚀</p>
  </div>
</div>
</body>
</html>
