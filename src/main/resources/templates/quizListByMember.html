<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>등록한 퀴즈 목록</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        color: #333;
        text-align: center;
    }
    h1, h2 {
        color: #555;
        margin-top: 40px;
    }
    table {
        border-collapse: collapse;
        margin: 20px auto;
        width: 80%;
        max-width: 800px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
    }
    th {
        background-color: #f2f2f2;
    }
    .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #007BFF;
        text-decoration: none;
    }
    .back-link:hover {
        text-decoration: underline;
    }
  </style>
</head>
<body>
<h1>회원이 등록한 퀴즈 목록</h1>
<h2><span th:text="${memberId}"></span>님의 퀴즈</h2>
<table>
  <thead>
  <tr>
    <th>내용</th>
    <th>정답</th>
    <th>등록일</th>
  </tr>
  </thead>
  <tbody>
  <tr th:if="${#lists.isEmpty(quizzes)}">
    <td colspan="3">등록된 퀴즈가 없습니다.</td>
  </tr>
  <tr th:unless="${#lists.isEmpty(quizzes)}"
      th:each="quiz : ${quizzes}">
    <td th:text="${quiz.content}">퀴즈 내용입니다.</td>
    <td th:text="${quiz.answer}">정답입니다.</td>
    <td th:text="${quiz.createdAt}">2024-01-01</td>
  </tr>
  </tbody>
</table>
<a class="back-link" th:href="@{/admin/stats}">멤버 리스트로 돌아가기</a>
</body>
</html>
