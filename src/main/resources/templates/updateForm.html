<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원정보 수정</title>
</head>
<body>
<h1>회원정보 수정</h1>
<form th:action="@{/member/update}" method="post" th:object="${dto}">
  <!-- 회원번호는 hidden으로 전달 -->
  <input type="hidden" th:field="*{no}">

  <div>
    <label for="id">아이디</label>
    <input type="text" id="id" name="id" th:field="*{id}" required>
    <div th:if="${#fields.hasErrors('id')}" th:errors="*{id}"></div>
  </div>

  <div>
    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" th:field="*{password}" required>
    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
  </div>
  <div>
    <label for="password2">비밀번호 확인</label>
    <input type="password" id="password2" name="password2">
  </div>

  <div>
    <label for="status">승인상태</label>
    <select id="status" name="status" th:field="*{status}">
      <option value="false">미승인</option>
      <option value="true">승인</option>
    </select>
  </div>

  <div>
    <label for="answerTrue">정답 수</label>
    <input type="number" id="answerTrue" name="answerTrue" th:field="*{answerTrue}" min="0">
  </div>

  <div>
    <label for="answerFalse">오답 수</label>
    <input type="number" id="answerFalse" name="answerFalse" th:field="*{answerFalse}" min="0">
  </div>

  <br>
  <input type="submit" value="수정완료">
  <input type="button" value="취소" onclick="location.href='/list'">
</form>
<br>
<a th:href="@{/list}">목록으로</a>
<script>
  function confirmPassword(){
      const pw = document.querySelector("#password").value;
      const pw2 = document.querySelector("#password2").value;
      if(pw !== pw2){
          alert("비밀번호가 일치하지 않아요");
          return false; // 폼을 post로 제출하는 것을 막는것
      }
      return true;  // 통과하면 submit 실행
  }
</script>
</body>
</html>
