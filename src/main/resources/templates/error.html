<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>오류 발생</title>
  <style>
    body {
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .error-container {
        padding: 40px;
        border: 2px solid #111;
        border-radius: 15px;
        text-align: center;
        max-width: 500px;
        width: 90%;
    }

    .error-icon {
        font-size: 5em;
        margin-bottom: 20px;
    }

    .error-title {
        font-size: 2em;
        color: #111;
        margin-bottom: 10px;
    }

    .error-message {
        color: #666;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    .btn {
        display: inline-block;
        padding: 12px 25px;
        background: #111;
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        transition: all 0.3s ease;
        border: 2px solid #111;
        cursor: pointer;
        font-size: 1em;
        box-sizing: border-box;
    }

    .btn:hover {
        background-color: #f6f6f6;
        border: 2px solid #111;
        color: #111;
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="error-icon">😵</div>
  <h1 class="error-title">오류가 발생했습니다</h1>
  <p class="error-message">
    요청하신 페이지를 처리하는 중 문제가 발생했습니다.<br>
    잠시 후 다시 시도해 주세요.
  </p>

  <div>
    <a href="/" class="btn">메인으로</a>
    <a href="/list" class="btn">회원 목록</a>
  </div>

  <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #999; font-size: 0.9em;">
    문제가 계속 발생하면 관리자에게 문의해 주세요.
  </div>
</div>
</body>
</html>
