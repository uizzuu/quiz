<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${isCorrect ? '정답입니다!' : '오답입니다.'}"></title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f3f4f6;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<div th:classappend="${isCorrect ? 'border-green-500' : 'border-red-500'}" class="bg-white p-8 rounded-xl shadow-lg text-center max-w-md w-full border-t-8">
  <!-- 정답/오답 아이콘 및 메시지 -->
  <div th:if="${isCorrect}" class="text-green-500">
    <div class="text-5xl mb-4">🎉</div>
    <h2 class="text-3xl font-bold mb-2">정답입니다!</h2>
  </div>
  <div th:if="${!isCorrect}" class="text-red-500">
    <div class="text-5xl mb-4">😢</div>
    <h2 class="text-3xl font-bold mb-2">아쉽지만 오답입니다.</h2>
  </div>

  <!-- 퀴즈 내용 -->
  <div class="bg-gray-100 p-4 rounded-lg mt-6 mb-4">
    <p class="text-gray-700 font-semibold mb-2" th:text="${quiz.content}"></p>
    <p class="text-sm text-gray-500">
      <span th:text="${'내 답변: ' + (userAnswer ? '예' : '아니오')}"></span> |
      <span th:text="${'정답: ' + (correctAnswer ? '예' : '아니오')}"></span>
    </p>
  </div>

  <!-- 버튼 그룹 -->
  <div class="mt-8 flex justify-center space-x-4">
    <!-- 다음 퀴즈 풀러 가기 버튼 -->
    <a th:href="@{/quiz/play}" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full transition duration-300 transform hover:scale-105">
      다음 퀴즈 풀기
    </a>

    <!-- 메인 페이지로 가기 버튼 -->
    <a href="/" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-6 rounded-full transition duration-300 transform hover:scale-105">
      메인으로
    </a>
  </div>
</div>
</body>
</html>
