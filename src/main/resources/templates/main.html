<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>메인</title>
  <style>
    body {
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f4f4f9;
    }

    .container {
        background: white;
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        max-width: 800px;
        width: 90%;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .logo {
        font-size: 3em;
        font-weight: bold;
        color: #111;
        margin-bottom: 10px;
    }

    .logo > span{
        font-size: 0.8em;
    }

    .subtitle {
        font-size: 1.2em;
        color: #666;
        margin-bottom: 40px;
    }

    .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
        margin: 40px 0;
    }

    .menu-card {
        background: #f6f6f6;
        padding: 30px;
        border-radius: 10px;
        border: 2px solid transparent;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .menu-card:hover {
        border-color: #111;
        background-color: #f2f2f2;
    }

    .menu-card .icon {
        font-size: 3em;
        margin-bottom: 15px;
    }

    .menu-card h3 {
        margin: 0 0 10px 0;
        color: #333;
        font-size: 1.5em;
    }

    .menu-card p {
        color: #666;
        margin: 0 0 20px 0;
        line-height: 1.5;
    }

    .btn {
        display: inline-block;
        padding: 12px 25px;
        background: #111;
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        transition: all 0.3s ease;
        border: 2px solid #111;
        cursor: pointer;
        font-size: 1em;
        box-sizing: border-box;
    }

    .btn:hover {
        background-color: #f6f6f6;
        border: 2px solid #111;
        color: #111;
    }

    .stats {
        background: #f6f6f6;
        padding: 20px;
        border-radius: 10px;
        margin: 30px 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
    }

    .stat-item {
        text-align: center;
    }

    .stat-number {
        font-size: 2em;
        font-weight: bold;
        color: #111;
        display: block;
    }

    .stat-label {
        color: #666;
        font-size: 0.9em;
    }

    .footer {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        color: #999;
        font-size: 0.9em;
    }

    @media (max-width: 600px) {
        .menu-grid {
            grid-template-columns: 1fr;
        }

        .stats {
            grid-template-columns: repeat(2, 1fr);
        }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo"><span>🎯</span> 퀴즈</div>
  <div class="subtitle">
    <span th:text="|안녕하세요, ${memberName}님! 재미있는 퀴즈로 지식을 테스트해보세요!|">
      안녕하세요! 재미있는 퀴즈로 지식을 테스트해보세요!
    </span>
  </div>

  <!-- 통계 정보 -->
  <div class="stats">
    <div class="stat-item">
      <!-- 📌[수정] totalQuizzes 값이 0으로 나오는 문제를 해결하기 위해 controller에서 값을 넘겨받도록 수정했습니다. -->
      <span class="stat-number" th:text="${totalQuizzes ?: 0}">0</span>
      <div class="stat-label">총 퀴즈수</div>
    </div>
    <div class="stat-item">
      <!-- 📌[수정] totalPlays 값이 0으로 나오는 문제를 해결하기 위해 controller에서 값을 넘겨받도록 수정했습니다. -->
      <span class="stat-number" th:text="${totalPlays ?: 0}">0</span>
      <div class="stat-label">총 플레이수</div>
    </div>
  </div>

  <!-- 메뉴 카드들 -->
  <div class="menu-grid">
    <div class="menu-card">
      <div class="icon">🎮</div>
      <h3>퀴즈 플레이</h3>
      <p>등록된 퀴즈를 풀어보고 점수를 확인할 수 있습니다. 지식을 테스트해보세요!</p>
      <a href="/quiz/play" class="btn">퀴즈 풀기</a>
    </div>

    <div class="menu-card">
      <div class="icon">📊</div>
      <h3>내 기록</h3>
      <p>내가 푼 퀴즈 기록과 점수를 확인할 수 있습니다.</p>
      <!-- 📌[수정] 내 기록 보기 링크를 올바른 URL과 파라미터로 변경 -->
      <a th:href="@{/member/info(updateId=${memberNo})}" class="btn">내 기록 보기</a>
    </div>
  </div>

  <!-- 로그아웃 버튼 -->
  <div style="margin: 30px 0;">
    <a href="/quiz/insertForm" class="btn" style="margin: 0 10px;">새 퀴즈 등록</a>
    <a href="/logout" class="btn" style="margin: 0 10px;">로그아웃</a>
  </div>

  <div class="footer">
    <p>&copy; 2024 Quiz Application. 퀴즈로 더 스마트해지세요! 🚀</p>
  </div>
</div>
</body>
</html>
